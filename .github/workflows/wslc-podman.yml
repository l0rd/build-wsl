name: WSLC on Podman (x64)

# Builds a WSL installer (wsl.msi) whose system VHD runs Podman as the WSLC
# backend, from forks of WSL, WSLg and Podman. See README.md.

on:
  workflow_dispatch:
    inputs:
      wsl_repo:
        description: "WSL repository (owner/name)"
        type: string
        default: l0rd/WSL
      wsl_ref:
        description: "WSL branch, tag or full commit SHA"
        type: string
        default: wslc-podman-test
      wslg_repo:
        description: "WSLg repository (owner/name) providing the system distro Dockerfile"
        type: string
        default: l0rd/wslg
      wslg_ref:
        description: "WSLg branch, tag or full commit SHA"
        type: string
        default: wslc-podman-test
      podman_repo:
        description: "Podman repository (owner/name) cloned by the WSLg Dockerfile"
        type: string
        default: l0rd/podman
      podman_ref:
        description: "Podman branch or tag (the Dockerfile clones with --branch; the commit is pinned automatically)"
        type: string
        default: wslc-podman-test
      build_type:
        description: "WSL build type"
        type: choice
        options: [Release, Debug]
        default: Release
      rebuild_vhd:
        description: "Rebuild the system VHD even if a cached one matches"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Versions of the WSLg vendor tarballs, as documented in WSLg config/BUILD.md.
  MESA_VERSION: "23.1.0"
  DIRECTX_HEADERS_VERSION: "1.608.0"
  TAR2EXT4_VERSION: "v0.13.0"
  # Bump to invalidate every cached system VHD.
  VHD_CACHE_EPOCH: "1"

jobs:
  resolve:
    name: Resolve refs
    runs-on: ubuntu-24.04
    if: github.actor == github.repository_owner
    timeout-minutes: 10
    outputs:
      wsl_sha: ${{ steps.resolve.outputs.wsl_sha }}
      wslg_sha: ${{ steps.resolve.outputs.wslg_sha }}
      podman_sha: ${{ steps.resolve.outputs.podman_sha }}
      freerdp_sha: ${{ steps.resolve.outputs.freerdp_sha }}
      weston_sha: ${{ steps.resolve.outputs.weston_sha }}
      pulseaudio_sha: ${{ steps.resolve.outputs.pulseaudio_sha }}
      vhd_cache_key: ${{ steps.resolve.outputs.vhd_cache_key }}
    steps:
      - name: Resolve every input ref to a commit
        id: resolve
        shell: bash
        env:
          WSL_REPO: ${{ inputs.wsl_repo }}
          WSL_REF: ${{ inputs.wsl_ref }}
          WSLG_REPO: ${{ inputs.wslg_repo }}
          WSLG_REF: ${{ inputs.wslg_ref }}
          PODMAN_REPO: ${{ inputs.podman_repo }}
          PODMAN_REF: ${{ inputs.podman_ref }}
        run: |
          set -euo pipefail

          for repo in "$WSL_REPO" "$WSLG_REPO" "$PODMAN_REPO"; do
            if [[ ! "$repo" =~ ^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$ ]]; then
              echo "::error::Invalid repository '$repo' (expected owner/name)"; exit 1
            fi
          done
          if [[ "$PODMAN_REF" =~ ^[0-9a-fA-F]{40}$ ]]; then
            echo "::error::podman_ref must be a branch or tag: the WSLg Dockerfile clones it with --branch"; exit 1
          fi

          # resolve <owner/name or URL> <ref>: prints the commit SHA of a branch,
          # tag (peeled) or full SHA.
          resolve() {
            local url=$1 ref=$2 refs sha
            [[ "$url" == https://* ]] || url="https://github.com/$url.git"
            if [[ "$ref" =~ ^[0-9a-fA-F]{40}$ ]]; then echo "${ref,,}"; return; fi
            refs=$(git ls-remote "$url")
            sha=$(awk -v r="refs/heads/$ref" '$2==r {print $1}' <<<"$refs")
            [[ -n "$sha" ]] || sha=$(awk -v r="refs/tags/$ref^{}" '$2==r {print $1}' <<<"$refs")
            [[ -n "$sha" ]] || sha=$(awk -v r="refs/tags/$ref" '$2==r {print $1}' <<<"$refs")
            if [[ -z "$sha" ]]; then echo "::error::Cannot resolve '$ref' in $url" >&2; return 1; fi
            echo "$sha"
          }

          wsl_sha=$(resolve "$WSL_REPO" "$WSL_REF")
          wslg_sha=$(resolve "$WSLG_REPO" "$WSLG_REF")
          podman_sha=$(resolve "$PODMAN_REPO" "$PODMAN_REF")
          freerdp_sha=$(resolve https://github.com/microsoft/FreeRDP-mirror.git working)
          weston_sha=$(resolve https://github.com/microsoft/weston-mirror.git working)
          pulseaudio_sha=$(resolve https://github.com/microsoft/pulseaudio-mirror.git working)

          inputs_hash=$(printf '%s\n' "$VHD_CACHE_EPOCH" "$PODMAN_REPO" "$PODMAN_REF" \
            "$freerdp_sha" "$weston_sha" "$pulseaudio_sha" "$MESA_VERSION" "$DIRECTX_HEADERS_VERSION" "$TAR2EXT4_VERSION" \
            | sha256sum | cut -c1-16)
          vhd_cache_key="system-vhd-x64-${wslg_sha}-${podman_sha}-${inputs_hash}"

          {
            echo "wsl_sha=$wsl_sha"
            echo "wslg_sha=$wslg_sha"
            echo "podman_sha=$podman_sha"
            echo "freerdp_sha=$freerdp_sha"
            echo "weston_sha=$weston_sha"
            echo "pulseaudio_sha=$pulseaudio_sha"
            echo "vhd_cache_key=$vhd_cache_key"
          } >> "$GITHUB_OUTPUT"

          {
            echo "### Inputs"
            echo "| component | repository | ref | commit |"
            echo "|---|---|---|---|"
            echo "| WSL | $WSL_REPO | $WSL_REF | \`$wsl_sha\` |"
            echo "| WSLg | $WSLG_REPO | $WSLG_REF | \`$wslg_sha\` |"
            echo "| Podman | $PODMAN_REPO | $PODMAN_REF | \`$podman_sha\` |"
            echo "| FreeRDP | microsoft/FreeRDP-mirror | working | \`$freerdp_sha\` |"
            echo "| weston | microsoft/weston-mirror | working | \`$weston_sha\` |"
            echo "| pulseaudio | microsoft/pulseaudio-mirror | working | \`$pulseaudio_sha\` |"
            echo "| mesa | tarball | $MESA_VERSION | |"
            echo "| DirectX-Headers | tarball | v$DIRECTX_HEADERS_VERSION | |"
            echo
            echo "Build type: \`${{ inputs.build_type }}\`, VHD cache key: \`$vhd_cache_key\`"
          } >> "$GITHUB_STEP_SUMMARY"

  system-vhd:
    name: Build system VHD (x86_64)
    runs-on: ubuntu-24.04
    needs: resolve
    if: github.actor == github.repository_owner
    timeout-minutes: 150
    steps:
      - name: Restore cached system VHD
        id: cache
        if: ${{ !inputs.rebuild_vhd }}
        uses: actions/cache/restore@v4
        with:
          path: system-vhd
          key: ${{ needs.resolve.outputs.vhd_cache_key }}

      - name: Free disk space and move Docker to /mnt
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          df -h / /mnt
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          docker system prune -af >/dev/null
          sudo systemctl stop docker docker.socket
          sudo mkdir -p /mnt/docker /mnt/work /etc/docker
          sudo chown "$(id -u):$(id -g)" /mnt/work
          if [ -s /etc/docker/daemon.json ]; then cfg=$(cat /etc/docker/daemon.json); else cfg='{}'; fi
          jq '. + {"data-root": "/mnt/docker"}' <<<"$cfg" | sudo tee /etc/docker/daemon.json
          sudo systemctl start docker
          docker info --format 'Docker root: {{.DockerRootDir}}'
          df -h / /mnt

      - name: Check out this repository
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          path: build-wsl

      - name: Check out WSLg
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.wslg_repo }}
          ref: ${{ needs.resolve.outputs.wslg_sha }}
          path: wslg
          fetch-depth: 0 # devops/get-nuget-version.sh needs tags

      - name: Fetch WSLg vendor sources (config/BUILD.md)
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          FREERDP_SHA: ${{ needs.resolve.outputs.freerdp_sha }}
          WESTON_SHA: ${{ needs.resolve.outputs.weston_sha }}
          PULSEAUDIO_SHA: ${{ needs.resolve.outputs.pulseaudio_sha }}
        run: bash build-wsl/scripts/fetch-wslg-vendor.sh wslg/vendor

      - name: Build the system distro image
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: wslg
        env:
          WSLG_SHA: ${{ needs.resolve.outputs.wslg_sha }}
          PODMAN_REPO: ${{ inputs.podman_repo }}
          PODMAN_REF: ${{ inputs.podman_ref }}
          PODMAN_SHA: ${{ needs.resolve.outputs.podman_sha }}
          FREERDP_SHA: ${{ needs.resolve.outputs.freerdp_sha }}
          WESTON_SHA: ${{ needs.resolve.outputs.weston_sha }}
          PULSEAUDIO_SHA: ${{ needs.resolve.outputs.pulseaudio_sha }}
        run: |
          set -euo pipefail
          # Same build args as build-and-export.sh, plus the Podman source.
          wslg_version=$(./devops/get-nuget-version.sh "-Beta" || true)
          wslg_version=${wslg_version:-dev}
          echo "WSLG_VERSION=$wslg_version"
          docker build -f Dockerfile -t system-distro-x64 . --progress=plain \
            --build-arg WSLG_ARCH=x86_64 \
            --build-arg WSLG_VERSION="$wslg_version" \
            --build-arg WSLG_COMMIT="$WSLG_SHA" \
            --build-arg PODMAN_REPO="https://github.com/$PODMAN_REPO.git" \
            --build-arg PODMAN_VERSION="$PODMAN_REF" \
            --build-arg PODMAN_COMMIT="$PODMAN_SHA" \
            --build-arg DIRECTX_HEADERS_VERSION="$DIRECTX_HEADERS_VERSION" \
            --build-arg FREERDP_COMMIT="$FREERDP_SHA" \
            --build-arg MESA_VERSION="$MESA_VERSION" \
            --build-arg PULSEAUDIO_COMMIT="$PULSEAUDIO_SHA" \
            --build-arg WESTON_COMMIT="$WESTON_SHA"

      - name: Export the rootfs and convert it to a VHD
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p system-vhd
          cid=$(docker create system-distro-x64)
          docker export "$cid" > /mnt/work/system_x64.tar
          docker cp "$cid:/etc/versions.txt" system-vhd/versions.txt
          docker rm "$cid"
          ls -lh /mnt/work/system_x64.tar
          echo "::group::versions.txt"; cat system-vhd/versions.txt; echo "::endgroup::"

      - name: Set up Go (for tar2ext4)
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - name: Run tar2ext4
        if: steps.cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          go run "github.com/Microsoft/hcsshim/cmd/tar2ext4@${TAR2EXT4_VERSION}" -vhd -i /mnt/work/system_x64.tar -o system-vhd/system.vhd
          rm -f /mnt/work/system_x64.tar
          (cd system-vhd && sha256sum system.vhd | tee system.vhd.sha256)
          ls -lh system-vhd

      - name: Save system VHD to the cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: system-vhd
          key: ${{ needs.resolve.outputs.vhd_cache_key }}

      - name: Upload system VHD
        uses: actions/upload-artifact@v4
        with:
          name: system-vhd-x64
          path: system-vhd/
          retention-days: 1 # only passed to build-wsl; the VHD is also cached
          if-no-files-found: error

  build-wsl:
    name: Build WSL x64 ${{ inputs.build_type }}
    runs-on: windows-2022
    needs: [resolve, system-vhd]
    if: github.actor == github.repository_owner
    timeout-minutes: 180
    env:
      BUILD_TYPE: ${{ inputs.build_type }}
    steps:
      - name: Check out WSL
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.wsl_repo }}
          ref: ${{ needs.resolve.outputs.wsl_sha }}
          path: wsl-src
          fetch-depth: 0 # the package version comes from `git describe --tags`

      - name: Download system VHD
        uses: actions/download-artifact@v4
        with:
          name: system-vhd-x64
          path: system-vhd

      - name: Generate build files
        shell: pwsh
        working-directory: wsl-src
        run: cmake . -A x64 "-DCMAKE_BUILD_TYPE=$env:BUILD_TYPE"

      - name: Replace the WSLg system VHD with the Podman one
        shell: pwsh
        working-directory: wsl-src
        run: |
          $version = (Select-Xml -Path packages.config -XPath "/packages/package[@id='Microsoft.WSLg']/@version").Node.Value
          $target = "packages\Microsoft.WSLg.$version\build\native\bin\x64\system.vhd"
          if (-not (Test-Path $target)) { throw "Restored WSLg system VHD not found at $target" }
          Write-Host "Replacing $target (WSLg $version)"
          Copy-Item ..\system-vhd\system.vhd $target -Force
          Get-FileHash $target -Algorithm SHA256 | Format-List

      - name: Build the MSI
        shell: pwsh
        working-directory: wsl-src
        run: cmake --build . --config $env:BUILD_TYPE --target msipackage -- -m

      - name: Check that the MSI contains the Podman system VHD
        shell: pwsh
        run: |
          $msi = "wsl-src/bin/x64/$env:BUILD_TYPE/wsl.msi"
          $extract = Join-Path $env:RUNNER_TEMP "wsl-msi"
          $proc = Start-Process msiexec.exe -ArgumentList @("/a", "`"$((Resolve-Path $msi).Path)`"", "/qn", "TARGETDIR=`"$extract`"") -Wait -PassThru -NoNewWindow
          if ($proc.ExitCode -ne 0) { throw "Extracting $msi failed: $($proc.ExitCode)" }
          $packaged = @(Get-ChildItem $extract -Recurse -Filter system.vhd)
          if ($packaged.Count -ne 1) { throw "Expected one system.vhd in $msi, found $($packaged.Count)" }
          $expected = (Get-FileHash system-vhd/system.vhd -Algorithm SHA256).Hash
          $actual = (Get-FileHash $packaged[0].FullName -Algorithm SHA256).Hash
          if ($expected -ne $actual) { throw "system.vhd in wsl.msi ($actual) is not the Podman system VHD ($expected)" }
          Write-Host "wsl.msi contains the Podman system VHD ($expected)"

      - name: Collect the installer
        shell: pwsh
        env:
          WSL_REPO: ${{ inputs.wsl_repo }}
          WSL_REF: ${{ inputs.wsl_ref }}
          WSL_SHA: ${{ needs.resolve.outputs.wsl_sha }}
          WSLG_REPO: ${{ inputs.wslg_repo }}
          WSLG_REF: ${{ inputs.wslg_ref }}
          WSLG_SHA: ${{ needs.resolve.outputs.wslg_sha }}
          PODMAN_REPO: ${{ inputs.podman_repo }}
          PODMAN_REF: ${{ inputs.podman_ref }}
          PODMAN_SHA: ${{ needs.resolve.outputs.podman_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          New-Item -ItemType Directory out | Out-Null
          Copy-Item "wsl-src/bin/x64/$env:BUILD_TYPE/wsl.msi" out/
          Copy-Item system-vhd/versions.txt out/system-distro-versions.txt
          [ordered]@{
            wsl = @{ repo = $env:WSL_REPO; ref = $env:WSL_REF; sha = $env:WSL_SHA }
            wslg = @{ repo = $env:WSLG_REPO; ref = $env:WSLG_REF; sha = $env:WSLG_SHA }
            podman = @{ repo = $env:PODMAN_REPO; ref = $env:PODMAN_REF; sha = $env:PODMAN_SHA }
            build_type = $env:BUILD_TYPE
            run = $env:RUN_URL
          } | ConvertTo-Json | Set-Content -Encoding utf8 out/build-info.json
          Get-ChildItem out | Format-Table Name, Length -AutoSize

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: wsl-msi-x64
          path: out/
          retention-days: 30
          if-no-files-found: error
