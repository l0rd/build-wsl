name: Build WSL MSI

on:
  workflow_dispatch:
    inputs:
      wsl_commit:
        description: "WSL commit SHA to build (from https://github.com/microsoft/WSL)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    name: Build WSL x64 Release
    runs-on: windows-2022
    if: github.actor == github.repository_owner
    timeout-minutes: 90

    steps:
      - name: Validate commit SHA format
        shell: pwsh
        run: |
          $commit = "${{ inputs.wsl_commit }}"
          if ($commit -notmatch '^[0-9a-fA-F]{7,40}$') {
            Write-Error "Invalid commit SHA format: '$commit'"
            exit 1
          }

      - name: Clone WSL repository at specified commit
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/WSL.git wsl-src
          cd wsl-src
          git checkout ${{ inputs.wsl_commit }}
          Write-Host "Building WSL at commit: $(git rev-parse HEAD)"
          Write-Host "Commit message: $(git log -1 --pretty=%s)"

      - name: Generate build files
        shell: pwsh
        working-directory: wsl-src
        run: cmake . -DCMAKE_BUILD_TYPE=Release

      - name: Build MSI package
        shell: pwsh
        working-directory: wsl-src
        run: cmake --build . --config Release --target msipackage -- -m

      - name: Upload MSI artifact
        uses: actions/upload-artifact@v4
        with:
          name: wsl-msi-x64-${{ inputs.wsl_commit }}
          path: wsl-src/bin/x64/Release/wsl.msi
          retention-days: 90
